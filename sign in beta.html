<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create an account for Unstoppable Detailing Services.">
    <title>Sign In | Unstoppable Detailing Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --text-main: #F5F5F7;
            --text-muted: #A3A3A3;
            --accent: #2563EB;
            --gold: #D4AF37;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 25px;
        }

        .brand-header .logo {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .auth-card h1 {
            font-size: 1.8rem;
            margin: 15px 0 5px;
            font-weight: 700;
        }

        .auth-card p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Unified Button Styles */
        .auth-btn, .btn-primary, .btn-submit, button[type="submit"] {
            background: #FFFFFF !important;
            color: #000000 !important;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 700 !important;
            border: none !important;
            position: relative;
            overflow: hidden;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
        }

        .auth-btn::before, .btn-primary::before, .btn-submit::before, button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #FFE885 0%, #D4AF37 50%, #997300 100%);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-btn:hover, .btn-primary:hover, .btn-submit:hover, button[type="submit"]:hover {
            color: #000000 !important;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
        }

        .auth-btn:hover::before, .btn-primary:hover::before, .btn-submit:hover::before, button[type="submit"]:hover::before {
            transform: scaleY(1);
        }

        .auth-btn:active, .btn-primary:active, .btn-submit:active, button[type="submit"]:active {
            box-shadow: 0 0 25px 8px rgba(212, 175, 55, 0.85), 0 0 50px 15px rgba(212, 175, 55, 0.45);
            transform: scale(0.96);
        }
