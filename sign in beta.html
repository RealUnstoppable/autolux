<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in or create an account for Unstoppable Detailing Services.">
    <title>Sign In | Unstoppable Detailing Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --text-main: #F5F5F7;
            --text-muted: #A3A3A3;
            --accent: #2563EB;
            --gold: #D4AF37;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .auth-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 30px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .brand-header {
            margin-bottom: 25px;
        }

        .brand-header .logo {
            font-weight: 800;
            font-size: 1.4rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 2px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .auth-card h1 {
            font-size: 1.8rem;
            margin: 15px 0 5px;
            font-weight: 700;
        }

        .auth-card p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 6px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #1d4ed8;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .toggle-container {
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-weight: 600;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0 4px;
            text-decoration: underline;
        }

        #auth-msg {
            margin-top: 15px;
            font-size: 0.85rem;
            min-height: 20px;
            font-weight: 600;
        }

        .back-home {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            transition: color 0.2s;
        }

        .back-home:hover {
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand-header">
            <a href="index.html" class="logo" aria-label="AutoLux Detailing Home">AUTOLUX<svg class="checker-flag" viewBox="0 0 24 18" width="1.1em" height="0.85em" style="display: inline-block; vertical-align: middle;" aria-hidden="true"><rect width="24" height="18" fill="#FFFFFF" rx="2"/><rect x="0" y="0" width="6" height="4.5" fill="#000000"/><rect x="12" y="0" width="6" height="4.5" fill="#000000"/><rect x="6" y="4.5" width="6" height="4.5" fill="#000000"/><rect x="18" y="4.5" width="6" height="4.5" fill="#000000"/><rect x="0" y="9" width="6" height="4.5" fill="#000000"/><rect x="12" y="9" width="6" height="4.5" fill="#000000"/><rect x="6" y="13.5" width="6" height="4.5" fill="#000000"/><rect x="18" y="13.5" width="6" height="4.5" fill="#000000"/><rect x="0" y="0" width="24" height="18" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" rx="2"/></svg></a>
        </div>
        <h1 id="auth-title">Welcome Back</h1>
        <p class="subtitle" id="auth-subtitle">Sign in to access your client portal</p>

        <form id="auth-form">
            <div class="form-group" id="name-group" style="display: none;">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Sign In</button>
        </form>

        <div id="auth-msg" aria-live="polite"></div>

        <div class="toggle-container">
            <span id="toggle-desc">Don't have an account?</span>
            <button type="button" class="toggle-btn" id="toggle-mode-btn">Sign Up</button>
        </div>

        <a href="index.html" class="back-home">← Return to Home</a>
    </div>

    <script type="module">
        import { auth, db, getUserRedirectPath, safeRedirect, ensureUserDocument } from '/js/auth.js';
        import { signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";

        let isSignUpMode = false;

        const form = document.getElementById('auth-form');
        const title = document.getElementById('auth-title');
        const subtitle = document.getElementById('auth-subtitle');
        const submitBtn = document.getElementById('submit-btn');
        const toggleBtn = document.getElementById('toggle-mode-btn');
        const toggleDesc = document.getElementById('toggle-desc');
        const nameGroup = document.getElementById('name-group');
        const nameInput = document.getElementById('name');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const authMsg = document.getElementById('auth-msg');

        // Check if user is already signed in
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const userData = await ensureUserDocument(user);
                const redirectPath = await getUserRedirectPath(user, userData, window.location.pathname);
                if (redirectPath && redirectPath !== 'sign in beta.html') {
                    safeRedirect(redirectPath);
                }
            }
        });

        toggleBtn.addEventListener('click', () => {
            isSignUpMode = !isSignUpMode;
            authMsg.textContent = '';
            
            if (isSignUpMode) {
                title.textContent = 'Create Account';
                subtitle.textContent = 'Sign up to manage your detailing bookings';
                submitBtn.textContent = 'Sign Up';
                toggleDesc.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Sign In';
                nameGroup.style.display = 'block';
                nameInput.required = true;
            } else {
                title.textContent = 'Welcome Back';
                subtitle.textContent = 'Sign in to access your client portal';
                submitBtn.textContent = 'Sign In';
                toggleDesc.textContent = "Don't have an account?";
                toggleBtn.textContent = 'Sign Up';
                nameGroup.style.display = 'none';
                nameInput.required = false;
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            const name = nameInput.value.trim();

            if (!email || !password) {
                authMsg.style.color = "var(--error)";
                authMsg.textContent = "Please provide both email and password.";
                return;
            }

            authMsg.textContent = '';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                let userCredential;
                if (isSignUpMode) {
                    userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    if (name && userCredential.user) {
                        await updateProfile(userCredential.user, { displayName: name });
                    }
                } else {
                    userCredential = await signInWithEmailAndPassword(auth, email, password);
                }

                const user = userCredential.user;
                const userData = await ensureUserDocument(user);

                authMsg.style.color = "var(--success)";
                authMsg.textContent = "Success! Redirecting...";

                const redirectPath = await getUserRedirectPath(user, userData, window.location.pathname) || 'account.html';
                setTimeout(() => {
                    safeRedirect(redirectPath);
                }, 500);

            } catch (error) {
                console.error("Auth Error:", error);
                authMsg.style.color = "var(--error)";
                let msg = "Authentication failed. Please check your details.";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msg = "Invalid email or password.";
                } else if (error.code === 'auth/email-already-in-use') {
                    msg = "An account with this email address already exists.";
                } else if (error.code === 'auth/weak-password') {
                    msg = "Password should be at least 6 characters.";
                }
                authMsg.textContent = msg;
                submitBtn.disabled = false;
                submitBtn.textContent = isSignUpMode ? 'Sign Up' : 'Sign In';
            }
        });
    </script>
</body>
</html>
