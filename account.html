<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Client Portal for Unstoppable Detailing Services clients.">
    <title>Client Portal | Unstoppable Detailing Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --text-main: #F5F5F7;
            --text-muted: #A3A3A3;
            --accent: #2563EB;
            --gold: #D4AF37;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 768px) {
            nav { padding: 15px 20px; }
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-card);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 25px;
        }

        .card h2 {
            font-size: 1.2rem;
            margin-top: 0;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: var(--gold);
        }

        .user-info p {
            margin: 8px 0;
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .user-info strong {
            color: var(--text-main);
        }

        .list-item {
            background: var(--bg-dark);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .list-item p {
            margin: 0 0 4px 0;
            font-weight: 600;
        }

        .list-item small {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: capitalize;
        }

        .status-badge.pending {
            color: #FBBF24;
            background: rgba(251, 191, 36, 0.15);
        }

        .status-badge.approved, .status-badge.completed {
            color: #16A34A;
            background: rgba(22, 163, 74, 0.15);
        }

        .status-badge.cancelled {
            color: var(--error);
            background: rgba(239, 68, 68, 0.15);
        }

        /* Unified Button Styles */
        .auth-btn, .btn-primary, .btn-schedule, button[type="submit"], .btn-logout {
            background: #FFFFFF !important;
            color: #000000 !important;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 700 !important;
            border: none !important;
            position: relative;
            overflow: hidden;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
        }

        .auth-btn::before, .btn-primary::before, .btn-schedule::before, button[type="submit"]::before, .btn-logout::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #FFE885 0%, #D4AF37 50%, #997300 100%);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-btn:hover, .btn-primary:hover, .btn-schedule:hover, button[type="submit"]:hover, .btn-logout:hover {
            color: #000000 !important;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
        }

        .auth-btn:hover::before, .btn-primary:hover::before, .btn-schedule:hover::before, button[type="submit"]:hover::before, .btn-logout:hover::before {
            transform: scaleY(1);
        }

        .auth-btn:active, .btn-primary:active, .btn-schedule:active, button[type="submit"]:active, .btn-logout:active {
            box-shadow: 0 0 25px 8px rgba(212, 175, 55, 0.85), 0 0 50px 15px rgba(212, 175, 55, 0.45);
            transform: scale(0.96);
        }
