<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Donate to enter the Unstoppable Detailing Community Sweepstakes and win massive prizes.">
    <title>Donate to Enter Sweepstakes | Unstoppable Detailing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --text-main: #F5F5F7;
            --text-muted: #A3A3A3;
            --accent: #2563EB;
            --gold: #D4AF37;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex-grow: 1;
        }

        .hero-banner {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.25);
            margin-bottom: 40px;
        }

        .hero-banner h1 {
            color: var(--gold);
            font-size: 2.3rem;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .hero-banner p {
            color: var(--text-main);
            font-size: 1.1rem;
            max-width: 650px;
            margin: 0 auto 30px auto;
        }

        .progress-container {
            width: 100%;
            height: 44px;
            background-color: #222;
            border-radius: 22px;
            margin-bottom: 25px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2563EB, #D4AF37);
            width: 1%;
            border-radius: 22px;
            transition: width 1s ease-in-out;
        }

        .progress-text {
            position: absolute;
            width: 100%;
            top: 0;
            left: 0;
            text-align: center;
            font-weight: 800;
            color: white;
            line-height: 44px;
            font-size: 1.05rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .tier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .tier-card {
            background: var(--bg-card);
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .tier-card:hover, .tier-card.selected {
            border-color: var(--gold);
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(212, 175, 55, 0.2);
            background: rgba(212, 175, 55, 0.05);
        }

        .tier-amount {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--gold);
            margin: 10px 0;
        }

        .tier-entries {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .tier-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .badge-popular {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gold);
            color: black;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 3px 12px;
            border-radius: 12px;
            text-transform: uppercase;
        }

        .donate-action-bar {
            text-align: center;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
        }

        /* Unified Button Styles */
        .auth-btn, .btn-primary, button[type="submit"] {
            background: #FFFFFF !important;
            color: #000000 !important;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 700 !important;
            border: none !important;
            position: relative;
            overflow: hidden;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 1rem;
        }

        .auth-btn::before, .btn-primary::before, button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #FFE885 0%, #D4AF37 50%, #997300 100%);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-btn:hover, .btn-primary:hover, button[type="submit"]:hover {
            color: #000000 !important;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
        }

        .auth-btn:hover::before, .btn-primary:hover::before, button[type="submit"]:hover::before {
            transform: scaleY(1);
        }

        .auth-btn:active, .btn-primary:active, button[type="submit"]:active {
            box-shadow: 0 0 25px 8px rgba(212, 175, 55, 0.85), 0 0 50px 15px rgba(212, 175, 55, 0.45);
            transform: scale(0.96);
        }
