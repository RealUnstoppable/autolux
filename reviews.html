<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Reviews | AutoLux Detailing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --text-main: #F5F5F7;
            --text-muted: #A3A3A3;
            --accent: #2563EB;
            --gold: #D4AF37;
            --border: rgba(255, 255, 255, 0.1);
        }
        
        body {
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg-dark); 
            color: var(--text-main); scroll-behavior: smooth; overflow-x: hidden;
            display: flex; flex-direction: column; min-height: 100vh;
        }

        /* Navbar */
        nav {
            position: fixed; top: 0; width: 100%; background: rgba(10, 10, 10, 0.95); 
            backdrop-filter: blur(10px); z-index: 1000; border-bottom: 1px solid var(--border);
            padding: 15px 20px; box-sizing: border-box; display: flex; 
            justify-content: space-between; align-items: center; flex-wrap: wrap;
        }
        .logo { font-weight: 800; font-size: 1.2rem; color: var(--text-main); text-decoration: none; letter-spacing: 1px; display: inline-flex; align-items: center; gap: 6px; }
        
        .menu-toggle {
            color: var(--text-main); font-size: 1.5rem; cursor: pointer; display: block; user-select: none;
            background: none; border: none; padding: 0;
        }
        
        .nav-links {
            display: none; width: 100%; flex-direction: column; gap: 15px; 
            margin-top: 15px; text-align: center;
        }
        .nav-links.active { display: flex; }
        
        .nav-links a {
            color: var(--text-main); text-decoration: none; font-weight: 500; 
            font-size: 1rem; transition: color 0.3s; padding: 10px 0; border-bottom: 1px solid #222;
        }
        .nav-links a:last-child { border-bottom: none; }
        .nav-links a:hover { color: var(--accent); }

        /* Unified Button Styles */
        .auth-btn, .btn-primary, button[type="submit"] {
            background: #FFFFFF !important;
            color: #000000 !important;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 700 !important;
            border: none !important;
            position: relative;
            overflow: hidden;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 1rem;
        }

        .auth-btn::before, .btn-primary::before, button[type="submit"]::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(180deg, #FFE885 0%, #D4AF37 50%, #997300 100%);
            z-index: -1;
            transform: scaleY(0);
            transform-origin: bottom;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-btn:hover, .btn-primary:hover, button[type="submit"]:hover {
            color: #000000 !important;
            box-shadow: 0 4px 18px rgba(212, 175, 55, 0.45);
        }

        .auth-btn:hover::before, .btn-primary:hover::before, button[type="submit"]:hover::before {
            transform: scaleY(1);
        }

        .auth-btn:active, .btn-primary:active, button[type="submit"]:active {
            box-shadow: 0 0 25px 8px rgba(212, 175, 55, 0.85), 0 0 50px 15px rgba(212, 175, 55, 0.45);
            transform: scale(0.96);
        }
