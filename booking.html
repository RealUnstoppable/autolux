<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Schedule your luxury detailing appointment with Unstoppable Detailing Services.">
    <title>Book a Detail | Unstoppable Detailing Services</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0A0A0A;
            --bg-card: #141414;
            --text-main: #F5F5F7;
            --text-muted: #A3A3A3;
            --accent: #2563EB;
            --gold: #D4AF37;
            --border: rgba(255, 255, 255, 0.1);
            --error: #ef4444;
            --success: #16a34a;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background: rgba(10, 10, 10, 0.95);
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-weight: 800;
            font-size: 1.3rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-links a {
            color: var(--text-main);
            text-decoration: none;
            margin-left: 20px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--accent);
        }

        .booking-container {
            max-width: 650px;
            margin: 50px auto;
            width: 100%;
            padding: 0 20px;
            flex-grow: 1;
        }

        .booking-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .booking-card h1 {
            margin-top: 0;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .booking-card p.desc {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .input-group input, .input-group select, .input-group textarea {
            width: 100%;
            padding: 12px 14px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
                /* Unified Button Styles */
        .auth-btn, .btn-primary, .btn-submit, button[type="submit"], .btn-white {
            background: #FFFFFF !important;
            color: #000000 !important;
            padding: 10px 22px;
            border-radius: 6px;
            font-weight: 700 !important;
            border: none !important;
            position: relative;
            overflow: hidden;
            z-index: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: color 0.3s ease, box-shadow 0.3s ease, transform 0.15s ease;
            box-sizing: border-box;
            cursor: pointer;
            font-size: 1rem;
        }

        .auth-btn::before, .btn-primary::before, .btn-submit::before, button[type="submit"]::before, .btn-white::before {
            content: '';
            position: absolute;
            top: 100%; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #FFE885 0%, #D4AF37 50%, #997300 100%);
            z-index: -1;
            transition: top 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: inherit;
        }

        .auth-btn:hover, .btn-primary:hover, .btn-submit:hover, button[type="submit"]:hover, .btn-white:hover {
            color: #000000 !important;
        }

        .auth-btn:hover::before, .btn-primary:hover::before, .btn-submit:hover::before, button[type="submit"]:hover::before, .btn-white:hover::before {
            top: 0;
        }

        .auth-btn:active, .btn-primary:active, .btn-submit:active, button[type="submit"]:active, .btn-white:active {
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.5), 0 0 20px 5px rgba(212, 175, 55, 0.8) !important;
            transform: scale(0.96);
        }

        /* Gold Buttons (Reverse Animation) */
        .btn-gold {
            background: linear-gradient(180deg, #FFE885 0%, #D4AF37 50%, #997300 100%) !important;
            color: #000000 !important;
        }

        .btn-gold::before {
            background: #FFFFFF !important;
        }

        .btn-gold:hover {
            box-shadow: none;
        }

        .btn-gold:active {
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.5), 0 0 20px 5px rgba(255, 255, 255, 0.8) !important;
            transform: scale(0.96);
        }

        #loading-overlay {
            text-align: center;
            padding: 20px;
            color: var(--gold);
            font-weight: 600;
        }

        #msg {
            margin-top: 20px;
            font-size: 0.95rem;
            text-align: center;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            nav { padding: 15px 20px; }
            .booking-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo" aria-label="AutoLux Detailing Home">AUTOLUX<svg class="checker-flag" viewBox="0 0 24 18" width="1.1em" height="0.85em" style="display: inline-block; vertical-align: middle;" aria-hidden="true"><rect width="24" height="18" fill="#FFFFFF" rx="2"/><rect x="0" y="0" width="6" height="4.5" fill="#000000"/><rect x="12" y="0" width="6" height="4.5" fill="#000000"/><rect x="6" y="4.5" width="6" height="4.5" fill="#000000"/><rect x="18" y="4.5" width="6" height="4.5" fill="#000000"/><rect x="0" y="9" width="6" height="4.5" fill="#000000"/><rect x="12" y="9" width="6" height="4.5" fill="#000000"/><rect x="6" y="13.5" width="6" height="4.5" fill="#000000"/><rect x="18" y="13.5" width="6" height="4.5" fill="#000000"/><rect x="0" y="0" width="24" height="18" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" rx="2"/></svg></a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="account.html">My Account</a>
        </div>
    </nav>

    <div class="booking-container">
        <div class="booking-card">
            <h1>Schedule Your Service</h1>
            <p class="desc">Select your detailing package or membership plan below to request an appointment.</p>

            <div id="loading-overlay">Checking authentication status...</div>

            <form id="booking-form" style="display: none;">
                <div class="input-group">
                    <label for="package">Select Service Package</label>
                    <select id="package" required>
                        <option value="">-- Choose a Package --</option>
                        <option value="Luxury Sedan - $150">Luxury Sedan ($150)</option>
                        <option value="Luxury SUV - $250">Luxury SUV ($250)</option>
                        <option value="Premium Truck - $280">Premium Truck ($280)</option>
                        <option value="Sprinter Van - $400">Sprinter Van ($400)</option>
                        <option value="AutoLux Detailing Club Plan - $99/mo">★ AutoLux Detailing Club Plan ($99/mo)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="vehicle">Vehicle (Year, Make, Model & Color)</label>
                    <input type="text" id="vehicle" placeholder="e.g. 2024 Mercedes G63 AMG - Black" required>
                </div>

                <div class="input-group">
                    <label for="date">Preferred Date & Time</label>
                    <input type="datetime-local" id="date" required>
                </div>

                <div class="input-group">
                    <label for="notes">Special Requests or Notes (Optional)</label>
                    <textarea id="notes" rows="3" placeholder="Tell us about specific spots, pet hair, or ceramic requests..."></textarea>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">Submit Booking Request</button>
            </form>

            <div id="msg"></div>
        </div>
    </div>

    <footer>
        &copy; 2026 Unstoppable Detailing Services. Buford, GA.
    </footer>

    <script type="module">
        import { auth, db } from '/js/auth.js';
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-auth.js";
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore.js";

        let currentUser = null;
        const bookingForm = document.getElementById('booking-form');
        const overlay = document.getElementById('loading-overlay');
        const submitBtn = document.getElementById('submit-btn');
        const msgEl = document.getElementById('msg');
        const packageSelect = document.getElementById('package');

        // Check for URL parameters (e.g., ?package=club or ?package=sedan)
        const urlParams = new URLSearchParams(window.location.search);
        const pkgParam = urlParams.get('package');
        if (pkgParam) {
            if (pkgParam.toLowerCase() === 'club' || pkgParam.toLowerCase() === 'membership') {
                packageSelect.value = "AutoLux Detailing Club Plan - $99/mo";
            } else if (pkgParam.toLowerCase() === 'sedan') {
                packageSelect.value = "Luxury Sedan - $150";
            } else if (pkgParam.toLowerCase() === 'suv') {
                packageSelect.value = "Luxury SUV - $250";
            } else if (pkgParam.toLowerCase() === 'truck') {
                packageSelect.value = "Premium Truck - $280";
            } else if (pkgParam.toLowerCase() === 'van') {
                packageSelect.value = "Sprinter Van - $400";
            }
        }

        // Set min date to today
        const dateInput = document.getElementById('date');
        const now = new Date();
        now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
        dateInput.min = now.toISOString().slice(0, 16);

        onAuthStateChanged(auth, (user) => {
            overlay.style.display = 'none';
            if (user) {
                currentUser = user;
                bookingForm.style.display = 'block';
            } else {
                sessionStorage.setItem('redirectAfterLogin', 'booking.html');
                msgEl.style.color = "var(--gold)";
                msgEl.innerHTML = 'You must be signed in to book an appointment. <a href="sign in beta.html" style="color: var(--accent);">Sign In Here</a>';
                setTimeout(() => {
                    window.location.replace('sign in beta.html');
                }, 1500);
            }
        });

        bookingForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const selectedPackage = packageSelect.value;
            const vehicle = document.getElementById('vehicle').value.trim();
            const appointmentDate = document.getElementById('date').value;
            const notes = document.getElementById('notes').value.trim();

            if (!selectedPackage || !vehicle || !appointmentDate) {
                msgEl.style.color = "var(--error)";
                msgEl.textContent = "Please fill in all required fields.";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting Request...';
            msgEl.textContent = '';

            try {
                const bookingDoc = {
                    userId: currentUser.uid,
                    customerEmail: currentUser.email || "",
                    package: selectedPackage,
                    vehicle: vehicle,
                    appointmentDate: appointmentDate,
                    notes: notes,
                    status: 'pending',
                    createdAt: serverTimestamp()
                };

                await addDoc(collection(db, "bookings"), bookingDoc);

                msgEl.style.color = "var(--success)";
                msgEl.textContent = 'Booking request submitted successfully! Redirecting to your account portal...';
                bookingForm.reset();

                setTimeout(() => {
                    window.location.href = 'account.html';
                }, 2000);

            } catch (error) {
                console.error("Booking Submission Error:", error);
                msgEl.style.color = "var(--error)";
                msgEl.textContent = 'Failed to submit booking request. Please try again.';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Booking Request';
            }
        });
    </script>
</body>
</html>
